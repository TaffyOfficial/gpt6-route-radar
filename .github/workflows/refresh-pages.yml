name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep the ten-minute cadence away from the top of the hour.
    # GitHub may delay or drop scheduled events; workflow_dispatch is the recovery path.
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ranking and collector
        run: |
          node test-rank.js
          node test-blacklist.js
          python -m unittest test_collect.py test_pages.py
      - name: Collect public market and build static site
        run: python build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    concurrency:
      group: route-radar-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
