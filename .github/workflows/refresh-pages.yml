name: Refresh data and deploy Pages

on:
  # Paused in repository settings. Kept only as an explicitly enabled fallback.
  # Normal publishing: server runs deploy/publish_pages.py and pushes gh-pages.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ranking and collector
        run: |
          node test-rank.js
          node test-blacklist.js
          node test-prices.js
          python -m unittest test_collect.py test_pages.py test_trigger.py
      - name: Collect public market and build static site
        run: python build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    concurrency:
      group: route-radar-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
