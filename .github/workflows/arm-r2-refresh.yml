name: Build on ARM and refresh R2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-refresh:
    runs-on: [self-hosted, Linux, ARM64, oracle-route-radar]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify ranking and collector
        run: |
          node test-rank.js
          node test-blacklist.js
          node test-prices.js
          node test-r2-upload.mjs
          python3 -m unittest test_collect.py test_pages.py test_trigger.py
      - name: Install collector and refresh R2
        run: sudo /usr/local/sbin/deploy-route-radar
