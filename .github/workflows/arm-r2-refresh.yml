name: Build on ARM and refresh R2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-refresh:
    runs-on: [self-hosted, Linux, ARM64, oracle-newapi-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify ranking and collector
        run: |
          node test-rank.js
          node test-blacklist.js
          node test-prices.js
          node test-r2-upload.mjs
          python -m unittest test_collect.py test_pages.py test_trigger.py
      - name: Install collector and refresh R2
        run: |
          sudo install -d -o route-radar -g route-radar /opt/gpt6-route-radar
          sudo rsync -a --delete --exclude='.git' --exclude='snapshot.json' --exclude='snapshot.js' ./ /opt/gpt6-route-radar/
          sudo chown -R route-radar:route-radar /opt/gpt6-route-radar
          sudo systemctl daemon-reload
          sudo systemctl enable --now gpt6-route-radar-refresh.timer
          sudo systemctl restart gpt6-route-radar-refresh.service
