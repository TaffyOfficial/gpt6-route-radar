name: Build on ARM and refresh R2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-refresh:
    runs-on: [self-hosted, Linux, ARM64, oracle-newapi]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify ranking and collector
        run: |
          node test-rank.js
          node test-blacklist.js
          node test-prices.js
          node test-r2-upload.mjs
          python -m unittest test_collect.py test_pages.py test_trigger.py
      - name: Install collector and refresh R2
        run: |
          sudo install -d -o route-radar -g route-radar /opt/gpt6-route-radar
          sudo rsync -a --delete --exclude='.git' --exclude='snapshot.json' --exclude='snapshot.js' ./ /opt/gpt6-route-radar/
          sudo chown -R route-radar:route-radar /opt/gpt6-route-radar
          sudo systemctl daemon-reload
          sudo systemctl enable --now gpt6-route-radar-refresh.timer
          sudo systemctl restart gpt6-route-radar-refresh.service

  publish-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Build Pages frontend
        run: python build_pages.py --pages --no-refresh
      - name: Publish Pages frontend
        run: npx wrangler@4.24.0 pages deploy dist --project-name route-radar --branch main
